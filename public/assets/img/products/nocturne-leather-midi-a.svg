  <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171719"/><stop offset=".6" stop-color="#0d0e10"/><stop offset="1" stop-color="#261a1c"/></linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22191a"/><stop offset="1" stop-color="#4c3334"/></linearGradient>
