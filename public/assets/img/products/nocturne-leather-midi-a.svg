<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-labelledby="title desc">
<title id="title">Nocturne Leather Midi - front study</title>
<desc id="desc">Original Starfall Enigma vector packshot for Nocturne Leather Midi, Skirts, front view.</desc>
<defs>
